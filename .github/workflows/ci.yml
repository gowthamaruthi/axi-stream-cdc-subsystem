name: Streaming subsystem checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install icarus-verilog verilator yosys
      - run: bash scripts/check.sh
      - run: python3 scripts/negative.py
      - run: bash examples/adc/check.sh
      - run: python3 examples/adc/negative.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-logs-and-failure-waveforms
          path: |
            build/*.log
            build/*.vcd
            build/adc/**
